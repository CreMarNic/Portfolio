<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">Task Manager project illustration</title>
  <desc id="desc">A dark task board with To do, In progress, and Completed columns.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1728"/><stop offset="1" stop-color="#243651"/></linearGradient></defs>
  <rect width="1000" height="600" fill="url(#bg)"/>
  <circle cx="920" cy="50" r="220" fill="#5eead4" opacity=".06"/>
  <rect x="60" y="62" width="880" height="476" rx="20" fill="#101a2b" stroke="#334155"/>
  <rect x="90" y="91" width="38" height="38" rx="11" fill="#5eead4"/>
  <path d="m100 110 7 7 13-15" fill="none" stroke="#102b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif"><text x="144" y="118" fill="#f8fafc" font-size="26" font-weight="700">Task Manager</text>
  <text x="91" y="160" fill="#94a3b8" font-size="16">Plan your day. Track your progress.</text>
  <rect x="757" y="98" width="150" height="36" rx="8" fill="#5eead4"/><text x="777" y="122" fill="#102b30" font-size="16" font-weight="700">+ New task</text>
  <g fill="#192539"><rect x="88" y="192" width="260" height="315" rx="12"/><rect x="370" y="192" width="260" height="315" rx="12"/><rect x="652" y="192" width="260" height="315" rx="12"/></g>
  <circle cx="112" cy="222" r="5" fill="#a5b4fc"/><circle cx="394" cy="222" r="5" fill="#fbbf24"/><circle cx="676" cy="222" r="5" fill="#5eead4"/>
  <g fill="#e2e8f0" font-size="17" font-weight="700"><text x="128" y="228">To do</text><text x="410" y="228">In progress</text><text x="692" y="228">Completed</text></g>
  <g fill="#263449" stroke="#3a4a60"><rect x="103" y="250" width="230" height="106" rx="9"/><rect x="103" y="370" width="230" height="106" rx="9"/><rect x="385" y="250" width="230" height="106" rx="9"/><rect x="667" y="250" width="230" height="106" rx="9"/></g>
  <g fill="#f1f5f9" font-size="16"><text x="120" y="280">Plan the next release</text><text x="120" y="400">Review feedback</text><text x="402" y="280">Build something great</text><text x="684" y="280">Set up the project</text></g>
  <g fill="#94a3b8" font-size="13"><text x="120" y="304">Project planning</text><text x="120" y="424">Product improvements</text><text x="402" y="304">Development</text><text x="684" y="304">Ready to go</text></g>
  <rect x="120" y="323" width="48" height="19" rx="5" fill="#713e50"/><text x="131" y="337" fill="#fda4af" font-size="11">HIGH</text>
  <rect x="402" y="323" width="68" height="19" rx="5" fill="#665329"/><text x="411" y="337" fill="#fde68a" font-size="11">MEDIUM</text>
  <text x="684" y="338" fill="#5eead4" font-size="13">&#10003; Done</text>
  </g>
</svg>
